<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>إدارة البورتفوليو | حمزة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#080d18;--line:#26354d;--cyan:#00e5ff;--blue:#4f8cff;--muted:#93a4bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#142943 0,transparent 45%),var(--bg);color:#f1f5f9;font-family:Cairo,system-ui,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:linear-gradient(120deg,var(--cyan),var(--blue));color:#03121c}input,textarea,select{width:100%;background:#0a1220;border:1px solid var(--line);border-radius:11px;padding:11px;color:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--cyan)}label{display:block;color:#b8c5d8;font-size:13px;margin:10px 0 5px}.wrap{max-width:1050px;margin:auto;padding:22px 15px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-size:23px;font-weight:800}.brand span{color:var(--cyan)}.sub{color:var(--muted);font-size:13px}.panel{background:#101827ef;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 60px #0003;margin-bottom:18px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.secondary{background:#1a2940;color:#e2e8f0;border:1px solid #344760}.danger{background:#4a1e2b;color:#ffd8df;border:1px solid #753244}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid var(--line);background:#0b1321;padding:13px;border-radius:14px}.item-info{min-width:0}.item-name{font-weight:800;overflow-wrap:anywhere}.meta,.small{font-size:12px;color:var(--muted);line-height:1.8}.item-actions{display:flex;gap:6px;flex-shrink:0}.item-actions button{padding:8px 10px;font-size:12px}.status{font-size:13px;margin-top:10px;color:var(--cyan);white-space:pre-wrap}.error{color:#ff9bab}h2{margin:0 0 8px;font-size:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:15px}.top{align-items:flex-start}.brand{font-size:19px}.item{align-items:flex-start;flex-direction:column}.item-actions{width:100%}.item-actions button{flex:1}.top button{padding:8px 10px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">HAMZA<span>.</span> ADMIN</div><div class="sub">لوحة إدارة مشاريع البورتفوليو</div></div><a href="./" style="color:var(--cyan);text-decoration:none;font-size:13px">← عرض الموقع</a></header>
<section id="loginPanel" class="panel"><h2>🔐 تسجيل الدخول</h2><p class="small">كلمة السر لا تُحفظ داخل ملفات الموقع.</p><label for="apiUrl">رابط Worker API</label><input id="apiUrl" placeholder="https://portfolio-admin-api.اسم-حسابك.workers.dev" dir="ltr"><label for="password">كلمة سر الإدارة</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة السر المضبوطة في Cloudflare"><div class="actions"><button id="loginBtn">دخول لوحة التحكم</button></div><div id="loginStatus" class="status"></div></section>
<section id="appPanel" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>مشاريعك</h2><div class="sub" id="count">جاري التحميل…</div></div><button id="newBtn">＋ مشروع جديد</button></div><div id="list" class="list" style="margin-top:16px"></div><div class="actions"><button class="secondary" id="reloadBtn">تحديث القائمة</button><button class="secondary" id="logoutBtn">تسجيل الخروج</button></div><div id="listStatus" class="status"></div></div>
<div class="panel hidden" id="formPanel"><h2 id="formTitle">إضافة مشروع</h2><form id="projectForm"><input type="hidden" id="id"><div class="grid"><div><label for="name">اسم المشروع *</label><input id="name" required maxlength="120"></div><div><label for="category">التصنيف</label><select id="category"><option value="web">مواقع</option><option value="3d">3D</option><option value="store">متجر</option><option value="game">ألعاب</option><option value="other">متنوع</option></select></div><div class="full"><label for="description">وصف مختصر *</label><textarea id="description" rows="2" required maxlength="500"></textarea></div><div class="full"><label for="url">رابط المشروع</label><input id="url" type="text" dir="ltr" placeholder="thanaweya.sheenomatp.workers.dev أو https://..."></div><div class="full"><label for="imageFile">صورة المشروع من جهازك</label><input id="imageFile" type="file" accept="image/*"><div id="imagePreviewWrap" class="hidden" style="margin-top:10px"><img id="imagePreview" alt="معاينة صورة المشروع" style="max-width:220px;max-height:150px;object-fit:contain;border-radius:12px;border:1px solid var(--line)"><button type="button" class="secondary" id="removeImageBtn" style="display:block;margin-top:8px">إزالة الصورة</button></div><div class="small">اختار صورة من جهازك؛ هتتضغط تلقائيًا قبل الحفظ.</div></div><div class="full"><label for="technologies">التقنيات (افصل بينها بفاصلة)</label><input id="technologies" placeholder="HTML, CSS, JavaScript"></div><div class="full"><label for="details">تفاصيل إضافية</label><textarea id="details" rows="3" maxlength="2000"></textarea></div><div class="full"><label><input id="visible" type="checkbox" checked style="width:auto;margin-left:7px"> المشروع ظاهر للزوار</label></div></div><div class="actions"><button type="submit">حفظ المشروع</button><button type="button" class="secondary" id="cancelBtn">إلغاء</button></div><div id="formStatus" class="status"></div></form></div></section></main>
<script>
const $=id=>document.getElementById(id);let api=localStorage.getItem('portfolioAdminApi')||'https://portfolio-admin-api.sheenomatp.workers.dev',token=sessionStorage.getItem('portfolioAdminToken')||'',projects=[];$('apiUrl').value=api;
const status=(id,msg,err=false)=>{$(id).textContent=msg;$(id).classList.toggle('error',err)};
function base(){const s=$('apiUrl').value.trim().replace(/\/+$/,'');if(!/^https:\/\//i.test(s))throw Error('اكتب رابط Worker يبدأ بـ https://');return s}
async function req(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(base()+path,{...opts,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'فشل الطلب '+r.status);return d}
$('loginBtn').onclick=async()=>{try{api=base();localStorage.setItem('portfolioAdminApi',api);status('loginStatus','جاري تسجيل الدخول…');const d=await req('/login',{method:'POST',body:JSON.stringify({password:$('password').value})});token=d.token;sessionStorage.setItem('portfolioAdminToken',token);$('password').value='';$('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');await load()}catch(e){status('loginStatus',e.message,true)}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){ $('count').textContent=projects.length+' مشروع';$('list').innerHTML=projects.length?projects.map((p,i)=>'<div class="item"><div class="item-info"><div class="item-name">'+esc(p.name)+'</div><div class="meta">'+esc(({web:'مواقع','3d':'3D',store:'متجر',game:'ألعاب',other:'متنوع'})[p.category]||'متنوع')+' · '+(p.visible===false?'<span style="color:#ffb4c0">مخفي</span>':'ظاهر')+'</div></div><div class="item-actions"><button class="secondary" data-edit="'+i+'">تعديل</button><button class="secondary" data-toggle="'+i+'">'+(p.visible===false?'إظهار':'إخفاء')+'</button><button class="danger" data-del="'+i+'">حذف</button></div></div>').join(''):'<p class="small">مفيش مشاريع لسه. اضغط مشروع جديد.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(+b.dataset.edit));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const p=projects[+b.dataset.toggle];p.visible=p.visible===false;if(!await save('تم تحديث الظهور'))await load()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.del;if(!confirm('متأكد من حذف «'+projects[i].name+'»؟'))return;projects.splice(i,1);if(!await save('تم حذف المشروع'))await load()})}
async function load(){try{status('listStatus','جاري التحميل…');const d=await req('/projects');projects=Array.isArray(d.projects)?d.projects:[];render();status('listStatus','اتحمّلت المشاريع بنجاح.')}catch(e){status('listStatus',e.message,true)}}
async function save(msg){try{status('listStatus','جاري الحفظ…');await req('/projects',{method:'PUT',body:JSON.stringify({projects})});render();status('listStatus',msg+' — الحفظ تم بنجاح.');return true}catch(e){status('listStatus',e.message,true);return false}}
function showImagePreview(src){if(src){$('imagePreview').src=src;$('imagePreviewWrap').classList.remove('hidden')}else{$('imagePreview').removeAttribute('src');$('imagePreviewWrap').classList.add('hidden')}}$('imageFile').onchange=()=>{const f=$('imageFile').files[0];if(f){if(!f.type.startsWith('image/')){status('formStatus','اختار ملف صورة صحيح.',true);$('imageFile').value='';return}showImagePreview(URL.createObjectURL(f))}};$('removeImageBtn').onclick=()=>{$('imageFile').value='';$('formPanel').dataset.existingImage='';showImagePreview('')};function form(i=null){$('projectForm').reset();$('id').value='';$('visible').checked=true;$('formStatus').textContent='';$('formPanel').classList.remove('hidden');showImagePreview('');if(i!==null){const p=projects[i];['id','name','category','description','url','details'].forEach(k=>$(k).value=p[k]||'');$('technologies').value=(p.technologies||[]).join(', ');$('visible').checked=p.visible!==false;$('formPanel').dataset.edit=String(i);$('formPanel').dataset.existingImage=p.image||'';showImagePreview(p.image||'');$('formTitle').textContent='تعديل المشروع'}else{delete $('formPanel').dataset.edit;$('formPanel').dataset.existingImage='';$('category').value='web';$('formTitle').textContent='إضافة مشروع'}$('formPanel').scrollIntoView({behavior:'smooth'})}
$('newBtn').onclick=()=>form();$('cancelBtn').onclick=()=>$('formPanel').classList.add('hidden');$('reloadBtn').onclick=load;
$('projectForm').onsubmit=async e=>{e.preventDefault();let projectUrl=$('url').value.trim();if(projectUrl&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(projectUrl))projectUrl='https://'+projectUrl;try{if(projectUrl){const parsed=new URL(projectUrl);if(!['http:','https:'].includes(parsed.protocol))throw Error();projectUrl=parsed.href}}catch{status('formStatus','راجع رابط المشروع، مثال: https://thanaweya.sheenomatp.workers.dev',true);return}status('formStatus','جاري تجهيز المشروع…');let image=$('formPanel').dataset.existingImage||'';const file=$('imageFile').files[0];if(file){try{if(!file.type.startsWith('image/'))throw Error('اختار ملف صورة صحيح');image=await compressImage(file)}catch(err){status('formStatus',err.message||'تعذر تجهيز الصورة',true);return}}const p={id:$('id').value.trim()||'p'+Date.now().toString(36),name:$('name').value.trim(),description:$('description').value.trim(),category:$('category').value,url:projectUrl,image,technologies:$('technologies').value.split(',').map(x=>x.trim()).filter(Boolean),visible:$('visible').checked,details:$('details').value.trim()};const i=$('formPanel').dataset.edit;if(i!==undefined)projects[+i]=p;else projects.unshift(p);if(await save('اتحفظ المشروع'))$('formPanel').classList.add('hidden');else await load()};function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('مش قادر أقرأ الصورة'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('الصورة غير صالحة'));img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',0.78);if(data.length>1800000){reject(Error('الصورة كبيرة بعد الضغط؛ اختار صورة أصغر.'));return}resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})};
$('logoutBtn').onclick=()=>{token='';sessionStorage.removeItem('portfolioAdminToken');$('appPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');status('loginStatus','تم تسجيل الخروج')};
if(token){$('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');load()}
</script></body></html>
